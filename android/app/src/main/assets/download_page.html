<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>ZTDrop 下载</title>
<style>
:root{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#22282d;background:#f5f7f7}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;background:radial-gradient(circle at 50% 0,#ecf8f0 0,#f5f7f7 36%,#f5f7f7 100%)}
main{width:min(100% - 34px,504px);margin:0 auto;padding:54px 0 34px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;font-size:18px;font-weight:750;letter-spacing:-.04em}
.mark{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#33ad70;color:#fff}
.mark svg{width:18px;height:18px}
.card{padding:30px;border:1px solid #e4e9e7;border-radius:22px;background:#fff;box-shadow:0 18px 42px #25453610}
.eyebrow{display:inline-flex;align-items:center;gap:7px;margin-bottom:12px;color:#328d61;font-size:12px;font-weight:700}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#3ab978}
h1{margin:0 0 8px;font-size:28px;line-height:1.22;letter-spacing:-.045em}
.sub{margin:0 0 25px;color:#69747b;font-size:14px;line-height:1.6}
.file{display:flex;align-items:center;gap:16px;min-width:0;padding:17px;border:1px solid #e6ece9;border-radius:15px;background:#f8fbf9}
.file-icon{flex:none;width:48px;height:54px;display:grid;place-items:center;border-radius:11px;color:#1f8d5b;background:#e3f3e9}
.file-icon svg{width:25px;height:25px}
.details{min-width:0}
.name{overflow-wrap:anywhere;font-size:15px;font-weight:700;line-height:1.45}
.size{display:block;margin-top:5px;color:#77838a;font-size:13px;line-height:1.4}
.download{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;margin-top:22px;border-radius:11px;background:#242c30;color:#fff;text-decoration:none;font-size:15px;font-weight:700}
.download:hover{background:#374247}
.download:focus-visible{outline:3px solid #43b778;outline-offset:3px}
.download svg{width:17px;height:17px}
.hint{margin:13px 0 0;color:#79848a;font-size:12px;line-height:1.5;text-align:center}
.foot{margin:22px 0 0;color:#859097;font-size:12px;text-align:center}
@media(max-width:560px){main{padding-top:30px}.brand{margin-bottom:32px}.card{padding:24px 20px;border-radius:19px}h1{font-size:25px}.file{gap:12px;padding:13px}.name{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M4 19h16"/></svg></span>ZTDrop</div>
<section class="card" aria-labelledby="page-title">
<span class="eyebrow">局域网文件分享</span>
<h1 id="page-title">文件已就绪</h1>
<p class="sub">对方通过 ZTDrop 分享了一个文件，点击下方按钮即可保存。</p>
<div class="file"><span class="file-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.5h7l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4A1.5 1.5 0 0 1 6.5 2.5Z"/><path d="M14 2.5V8h5M8.5 13h7M8.5 16.5h5"/></svg></span><span class="details"><span class="name">__FILE_NAME__</span><span class="size">__FILE_SIZE__</span></span></div>
<a class="download" href="/download/__TOKEN__"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 19h16"/></svg>下载文件</a>
<p class="hint">请保持与分享设备连接同一局域网</p>
<p id="status" class="hint" role="status"></p>
</section>
<p class="foot">文件由分享设备直接传输 · ZTDrop</p>
</main>
__STATUS_SCRIPT__
</body>
</html>
