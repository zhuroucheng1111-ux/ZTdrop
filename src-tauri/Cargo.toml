[package]
name = "ztdrop"
version = "1.0.0"
description = "ZTDrop - LAN file transfer with 4-digit share codes"
authors = ["zhuroucheng"]
license = "MIT"
repository = "https://github.com/zhuroucheng1111-ux/ZTdrop"
edition = "2021"

[lib]
name = "ztdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
local-ip-address = "0.6"
hostname = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
