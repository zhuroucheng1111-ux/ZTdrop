name: Windows 构建

# 触发时机：
#   - push 到 main / 向 main 提 PR：只跑检查与单元测试，不打包（省时长）
#   - push 形如 v0.9.21 的标签：检查 + 打包 + 自动发布 Release
#   - 手动在 Actions 页面点 Run workflow：检查 + 打包，但只上传产物，不发 Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: 检查与单元测试
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 前端类型检查与打包
        run: npm run build

      - name: Rust 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust 单元测试
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  package:
    name: 打包 Windows 安装包
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write # 打标签时创建 Release 需要
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 读取版本号
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "版本号：$version"

      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $version = "${{ steps.meta.outputs.version }}"
          if ($tag -ne $version) {
            throw "标签 v$tag 与源码版本 $version 不一致：请先同步 package.json、src-tauri/Cargo.toml、src-tauri/tauri.conf.json 和 src/App.tsx 中的 APP_VERSION。"
          }

      # 普通 NSIS 安装包。both 构建会写成同名文件，所以必须先另存，再构建离线包。
      - name: 构建普通安装包
        run: npm run tauri build

      - name: 另存普通安装包
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path ci-out | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/ZTDrop_${version}_x64-setup.exe" "ci-out/ZTDrop_${version}_x64-setup.exe"

      - name: 构建 WebView2 离线安装包
        run: npm run tauri build -- --config src-tauri/tauri.offline-webview.conf.json

      - name: 另存离线安装包
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          Copy-Item "src-tauri/target/release/bundle/nsis/ZTDrop_${version}_x64-setup.exe" "ci-out/ZTDrop_${version}_x64-offline-setup.exe"

      - name: 制作免安装版压缩包
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $dir = "ZTDrop-V$version-portable-Win11-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "src-tauri/target/release/ztdrop.exe" "$dir/ZTDrop.exe"
          Compress-Archive -Path $dir -DestinationPath "ci-out/$dir.zip" -Force

      - name: 生成 SHA-256 校验清单
        shell: pwsh
        run: |
          $lines = Get-ChildItem ci-out -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToUpper())  $($_.Name)" }
          $lines | Set-Content -Encoding utf8 "ci-out/SHA256SUMS.txt"
          Get-Content "ci-out/SHA256SUMS.txt"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ZTDrop-${{ steps.meta.outputs.version }}-windows-x64
          path: ci-out/*
          if-no-files-found: error
          retention-days: 14

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ZTDrop ${{ steps.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ci-out/ZTDrop_${{ steps.meta.outputs.version }}_x64-setup.exe
            ci-out/ZTDrop_${{ steps.meta.outputs.version }}_x64-offline-setup.exe
            ci-out/ZTDrop-V${{ steps.meta.outputs.version }}-portable-Win11-x64.zip
            ci-out/SHA256SUMS.txt
